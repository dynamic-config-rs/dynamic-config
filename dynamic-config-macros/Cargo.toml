[package]
name = "dynamic-config-macros"
description = "Procedural macro implementation for the `dynamic-config` crate. Do not depend on this directly."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dynamic-config-macros"
authors.workspace = true
categories = ["config", "development-tools::procedural-macro-helpers"]
keywords = ["config", "macro", "derive", "hot-reload", "settings"]
exclude.workspace = true

[lib]
proc-macro = true

[dependencies]
# Resolves the facade crate's real name from the *consumer's* manifest, so a
# renamed dependency still gets an expansion it can compile. It pulls
# `toml_edit`, which has historically moved its MSRV faster than this floor —
# measured against real 1.71/1.74 toolchains before it was added rather than
# read off a manifest, and the resolution this workspace's MSRV fallback picks
# (3.4 over `toml_edit` 0.23) builds on 1.71.
proc-macro-crate = "3.4"
proc-macro2 = "1.0.95"
# 1.0.38 rather than the 1.0.35 this crate itself needs: `pyo3-macros-backend`
# asked for 1.0.37 and `jiff-static` — reached through `gix` since the git
# store joined the workspace — asks for 1.0.38. `just minimal-versions` pins
# every *direct* requirement to its declared floor, so a lower number here is
# a floor that cannot resolve in this workspace. Declaring the one that does
# is the point of that check.
quote = "1.0.38"
# `full` is required for `syn::ItemStruct`; the rest are defaults, spelled out so
# a future `default-features = false` stays correct.
syn = { version = "3.0", features = ["full", "parsing", "printing", "proc-macro"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
