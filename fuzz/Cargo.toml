# Coverage-guided fuzzing for the parsing surfaces that a config file can
# reach. proptest (in `dynamic-config/tests/properties.rs`) still carries the
# correctness argument on stable; this is the coverage-guided half, and the
# thing OSSF Scorecard recognises.
#
# Its own workspace, deliberately: `libfuzzer-sys` needs nightly and a
# sanitizer, and neither belongs in the lockfile or the MSRV story of a crate
# whose floor is 1.71. Nothing in the default gate builds this.

[package]
name = "dynamic-config-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Detaches from the root workspace: see above.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Structure-aware generation. Bytes into a path walker is a waste — the
# interesting inputs are tree shapes and path shapes, not byte strings.
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"

# `default-features = false`: every target below works on the value, unit and
# name surfaces, none of which needs a document format. A smaller graph is a
# faster fuzz build, and a fuzz build happens on every CI run.
#
# `dotenv` is the one exception, and it costs nothing: the feature carries no
# dependency — a `.env` is read by a line splitter in this crate, not by a
# parser library — and without it `__fuzz::dotenv_entries` does not exist.
[dependencies.dynamic-config]
path = "../dynamic-config"
default-features = false
features = ["dotenv", "ini", "properties", "json"]

# Fuzzing wants the optimised build with debug assertions still on: an
# overflow that `--release` wraps silently is exactly the class of bug this is
# looking for.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

[[bin]]
name = "text_value"
path = "fuzz_targets/text_value.rs"
test = false
doc = false
bench = false

[[bin]]
name = "units"
path = "fuzz_targets/units.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redaction"
path = "fuzz_targets/redaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "value_paths"
path = "fuzz_targets/value_paths.rs"
test = false
