[package]
name = "dynamic-config"
description = "Hot-reloadable, lock-free application configuration with a one-attribute API, built on figment."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dynamic-config"
authors.workspace = true
categories.workspace = true
keywords.workspace = true
exclude.workspace = true

[features]
default = ["json"]
json = ["figment/json", "dep:serde_json"]
toml = ["figment/toml", "dep:toml"]
yaml = ["figment/yaml", "dep:serde_yaml"]
# Hand-written parsers over figment's provider seam — no new dependency.
# INI's dialect and properties' deliberate JDK deviations are in the book.
ini = []
properties = []
watch = ["dep:notify"]
tracing = ["dep:tracing"]
# The engine's own diagnostics through the `log` crate's global logger —
# for programs that standardised on `log` rather than `tracing`. A sink
# installed with `set_log_sink` outranks it; `tracing` outranks both.
log = ["dep:log"]
# Runtime-agnostic: no dependency at all. `Changes` is a `Future`, and blocking
# work goes to a thread unless an executor is installed.
async = []
# `async`, plus tokio's blocking pool instead of a thread per load.
tokio = ["async", "dep:tokio"]
# Copies clap arguments into the flags layer. The only feature that pins another
# crate's major version, which is why it is opt-in and separate.
clap = ["dep:clap"]
# A JSON Schema for the config files, so editors complete and validate them.
# Raises the MSRV to 1.74, which is schemars' own floor.
schema = ["dep:schemars", "dep:serde_json"]
# The `Decryptor` trait and `set_decryptor`, for a scheme of your own. Pulls in
# `zeroize`, so the decrypted text is wiped whatever the scheme is.
decrypt = ["dep:zeroize"]
# `Source::provider`, and figment itself re-exported. The only feature that puts
# figment in a signature: with it off, a figment major bump is not a breaking
# change here, and with it on you have opted into that coupling knowingly.
figment = []
# `.env` files, read as the environment layer rather than as documents.
dotenv = []
# Transparent decryption of `age`-encrypted config files.
age = ["decrypt", "dep:age"]
# `telemetry::Exposition`: a `ConfigStatus` rendered as Prometheus text. **No
# dependency at all** — the text format is a wire encoding, not a crate — so
# this crate still picks no metrics ecosystem for its users.
telemetry = []
full = [
    "json",
    "toml",
    "yaml",
    "ini",
    "properties",
    "watch",
    "async",
    "tokio",
    "clap",
    "schema",
    "age",
    "figment",
    "dotenv",
    "tracing",
    "telemetry",
]

[dependencies]
dynamic-config-macros = { workspace = true }
# `1.9`: `gix-odb` requires it, and the Python remote wheel puts the git
# store in this crate's graph. Nothing here needs 1.9 for itself — the floor
# is the union's, which is what `-Z direct-minimal-versions` measures.
arc-swap = "1.9"
log = { version = "0.4.22", optional = true }
serde = "1.0.221"
# The loader. Not optional: it is the only backend.
figment = { version = "0.10.19", default-features = false, features = ["env"] }
clap = { version = "4.4", optional = true, default-features = false, features = [
    "std",
] }

# Writing configuration back out. figment reads through its own copies of these;
# depending on them directly costs no extra compilation, only the serializers it
# does not expose.
serde_json = { version = "1.0.127", optional = true }
toml = { version = "0.9", optional = true }
serde_yaml = { version = "0.9", optional = true }

schemars = { version = "1.2", optional = true, default-features = false, features = [
    "std",
] }

age = { version = "0.12", optional = true, default-features = false, features = [
    "armor",
] }
zeroize = { version = "1.8", optional = true }

notify = { version = "8.0", optional = true }
tracing = { version = "0.1.40", optional = true }
tokio = { version = "1.47", optional = true, default-features = false, features = [
    "rt",
] }

[dev-dependencies]
serde = { version = "1.0.221", features = ["derive"] }
schemars = "1.2"
# The example encrypts a file before reading it back, which is what a
# deployment does once with the CLI.
age = "0.12"

clap = { version = "4.4", features = ["derive"] }
# Only for inspecting what `save` wrote.
serde_json = "1.0.127"

# `3.26`: `gix-odb` requires it, and `dynamic-config-python-remote` puts the
# git store in the same graph as everything else. `-Z direct-minimal-versions`
# pins a bare `3` to 3.0.0, which nothing in that union can build against.
tempfile = "3.26"
# Property tests: stable-toolchain fuzzing for the parsing surfaces. A
# dev-dependency, so it never touches the MSRV story — the floor jobs are
# `cargo check` without tests.
proptest = "1"
trybuild = "1.0"

# The runtimes and web frameworks the examples exercise, kept out of the
# model-checking builds. For loom it is a correctness matter: `--cfg loom`
# applies to every crate in the graph, and tokio (and the executors built on
# it or on `event-listener`) have their own loom wiring that a plain flag does
# not satisfy. For shuttle it is cost — a separate `RUSTFLAGS` is a separate
# build cache, and a job that recompiles axum and criterion to run four models
# is a job nobody waits for. Either way the model job builds one test target,
# which touches none of these.
[target.'cfg(not(any(loom, shuttle)))'.dev-dependencies]
# The statistics-driven benches (`benches/engine.rs`). Default features off:
# the HTML reports pull a plotting stack nobody reads in CI. Held at 0.5,
# not the newest: 0.6+ requires `clap ^4.5`, and the CLI pins `clap 4.4`
# for the MSRV floor — one workspace lockfile cannot hold both.
criterion = { version = "0.5", default-features = false }
# `benches/instructions.rs`. The library half only; the `iai-callgrind-runner`
# binary it shells out to is installed separately and must match this version
# exactly — the runner refuses a mismatch rather than producing wrong numbers,
# which is the most common way a first setup fails. CONTRIBUTING.md says so
# next to the command.
iai-callgrind = "0.16.1"
# The two web-framework examples. Dev-dependencies, so nothing a user of this
# crate depends on.
axum = "0.8"
actix-web = "4.9"
# Two runtimes that are not tokio, to keep the runtime-agnostic claim honest.
smol = "2.0"
embassy-executor = { version = "0.10", features = [
    "platform-std",
    "executor-thread",
] }
embassy-futures = "0.1"
static_cell = "2.1"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
# docs.rs builds for one target by default; the watcher's backend differs per
# platform, so the others are worth having rendered.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# No libtest bench harness on the lib: `cargo bench -- --quick` forwards
# the flag to every bench target, and libtest dies on flags it does not
# know. The benchmarks all live in `benches/` with their own harnesses.
[lib]
bench = false

[[bench]]
name = "read_path"
harness = false
required-features = ["json"]

[[bench]]
name = "engine"
harness = false
required-features = ["json"]

[[bench]]
name = "alloc_profile"
harness = false
required-features = ["json"]

# Instruction counts rather than wall clock, and the only bench that is a
# regression gate. It needs valgrind and a version-matched
# `iai-callgrind-runner` to *run*; `cargo bench --no-run` compiles it in the
# ordinary gate so a broken harness is caught without either.
[[bench]]
name = "instructions"
harness = false
required-features = ["json", "toml"]

[[example]]
name = "basic"
required-features = ["json"]

[[example]]
name = "env_only"
required-features = ["json"]

[[example]]
name = "hot_reload"
required-features = ["watch", "toml"]

[[example]]
name = "group"
required-features = ["json"]

[[example]]
name = "testing"
required-features = ["json"]

[[example]]
name = "sections"
required-features = ["json", "watch"]

[[example]]
name = "no_macro"
required-features = ["json"]

[[example]]
name = "persistence"
required-features = ["json"]

[[example]]
name = "units"
required-features = ["json"]

[[example]]
name = "generic"
required-features = ["json"]

[[example]]
name = "errors"
required-features = ["json"]

[[example]]
name = "secrets"
required-features = ["json"]

[[example]]
name = "validation"
required-features = ["json"]

[[example]]
name = "layers"
required-features = ["json"]

[[example]]
name = "discovery"
required-features = ["json"]

[[example]]
name = "cli"
required-features = ["clap", "json"]

[[example]]
name = "async_reload"
required-features = ["async", "watch", "json"]

[[example]]
name = "schema"
required-features = ["schema", "json"]

[[example]]
name = "encrypted"
required-features = ["age", "json"]

[[example]]
name = "axum_hello"
required-features = ["watch", "json"]

[[example]]
name = "actix_hello"
required-features = ["watch", "json"]

[[example]]
name = "tokio_runtime"
required-features = ["tokio", "watch", "json"]

[[example]]
name = "smol_runtime"
required-features = ["async", "watch", "json"]

[[example]]
name = "embassy_runtime"
required-features = ["async", "json"]

[[example]]
name = "remote"
required-features = ["json"]

[[example]]
name = "last_known_good"
required-features = ["json"]

# The only example that needs the `figment` feature, because it is the only
# one that reaches the one door figment appears in.
[[example]]
name = "ini_provider"
required-features = ["figment", "json"]

[[example]]
name = "flat_formats"
required-features = ["ini", "properties"]

[[example]]
name = "graceful_shutdown"
required-features = ["json", "watch"]

# `--cfg loom` and `--cfg shuttle` build swap std::sync for loom's or
# shuttle's mirror (src/sync.rs); the cfgs are declared here so stable builds
# do not warn about them.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(shuttle)"] }

# A real dependency, not a dev one: the library itself swaps its primitives
# under `--cfg loom`, and dev-dependencies are invisible to it. Inert in
# every build that does not pass the cfg.
[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", features = ["futures"] }

# The same arrangement for shuttle, and for the same reason: `tests/shuttle.rs`
# drives the library's own primitives, so the library has to be built against
# shuttle's. Unlike loom's, shuttle's constructors are `const`, so nothing in
# the crate needs a second `new` — `src/sync.rs` is the only file that knows.
[target.'cfg(shuttle)'.dependencies]
shuttle = "0.9"
