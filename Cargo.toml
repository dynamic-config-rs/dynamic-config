[workspace]
members = [
    "dynamic-config",
    "dynamic-config-macros",
    "dynamic-config-cli",
    "dynamic-config-store-core",
    "dynamic-config-vault",
    "dynamic-config-consul",
    "dynamic-config-etcd",
    "dynamic-config-nats",
    "dynamic-config-embedded",
    "dynamic-config-redis",
    "dynamic-config-s3",
    "dynamic-config-firestore",
    "dynamic-config-git",
    "dynamic-config-server",
    "dynamic-config-python",
    "dynamic-config-python-remote",
    "dynamic-config-node",
    "dynamic-config-node-remote",
]
resolver = "2"

[workspace.package]
version = "0.6.1"
edition = "2021"
rust-version = "1.71"
license = "MIT"
repository = "https://github.com/ctolon/dynamic-config"
homepage = "https://github.com/ctolon/dynamic-config"
documentation = "https://docs.rs/dynamic-config"
authors = ["Cevat Batuhan Tolon <cevatbatuhan.tolon@gmail.com>"]
categories = ["config", "development-tools"]
keywords = ["config", "hot-reload", "settings", "watch", "serde"]
# Everything a build needs and nothing else. Tests and benches are excluded
# rather than included by omission: the fixtures they read are not in the
# package either, so shipping them would only ship something that cannot run.
exclude = [
    "tests/**",
    "benches/**",
]

[workspace.dependencies]
dynamic-config-macros = { version = "=0.6.1", path = "dynamic-config-macros" }
dynamic-config = { version = "=0.6.1", path = "dynamic-config", default-features = false }
# The store crates' shared internals. Published because cargo will not let a
# published crate depend on one that is not — not because anything outside
# this workspace should name it.
dynamic-config-store-core = { version = "=0.6.1", path = "dynamic-config-store-core" }

# One profile for the benchmark to be worth reading.
[profile.bench]
lto = "thin"
codegen-units = 1
