# The engine, and the three crates that cannot be anywhere else: the macro
# it re-exports, the `no_std` cell that shares its vocabulary, and the CLI
# that reads what it resolves.
#
# The stores, the server and the two bindings live in their own
# repositories, each naming this crate with a caret — see
# https://github.com/dynamic-config-rs.
[workspace]
members = [
    "dynamic-config",
    "dynamic-config-macros",
    "dynamic-config-cli",
    "dynamic-config-embedded",
]
resolver = "2"

[workspace.package]
version = "0.6.3"
edition = "2021"
rust-version = "1.71"
license = "MIT"
repository = "https://github.com/dynamic-config-rs/dynamic-config"
homepage = "https://github.com/dynamic-config-rs/dynamic-config"
documentation = "https://docs.rs/dynamic-config"
authors = ["Cevat Batuhan Tolon <cevatbatuhan.tolon@gmail.com>"]
categories = ["config", "development-tools"]
keywords = ["config", "hot-reload", "settings", "watch", "serde"]
# Everything a build needs and nothing else. Tests and benches are excluded
# rather than included by omission: the fixtures they read are not in the
# package either, so shipping them would only ship something that cannot run.
exclude = [
    "tests/**",
    "benches/**",
]

[workspace.dependencies]
dynamic-config-macros = { version = "=0.6.3", path = "dynamic-config-macros" }
dynamic-config = { version = "=0.6.3", path = "dynamic-config", default-features = false }

# One profile for the benchmark to be worth reading.
[profile.bench]
lto = "thin"
codegen-units = 1
