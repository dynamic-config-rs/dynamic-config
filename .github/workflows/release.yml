name: Release

# Releases are managed through the pull-request pipeline, not by hand-pushed
# tags: merging a version-bump PR into `main` IS the release. Every push to
# `main` lands here; the `decide` job checks whether the workspace version is
# new, and everything downstream is skipped when it is not — so a docs merge
# is a green no-op and a version bump is a release.
#
# The tag is an *output* of a successful publish, minted by CI at the merge
# commit. Since `main` only accepts pull requests that passed the gates, a
# release inherits the whole review pipeline by construction.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    name: is this a release?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: check
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new — this push is a release."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: verify before publishing
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: the changelog names this version
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no section for $VERSION"
            exit 1
          fi

      # `etcd-client` compiles its gRPC stubs at build time and needs `protoc`.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all -- --check
      # `--exclude dynamic-config-python` for the same reason ci.yml and
      # the justfile exclude it: an extension module links no libpython, so
      # its Rust test target is a harness with nothing behind it. It links
      # on Linux today and would not on every platform — and a release
      # gate is the wrong place to find that out. Its library is linted on
      # its own line instead.
      - run: >
          cargo clippy --workspace --all-targets --all-features
          --exclude dynamic-config-python
      - run: cargo clippy -p dynamic-config-python --lib --all-features
      # The same excludes as ci.yml's test job: the container suites need
      # Docker images pulled and a long leash, and they gate merges to main —
      # a release build re-proving them adds an hour, not confidence. The
      # embedded crate has its own features and no `full`.
      - run: >
          cargo test --workspace --features full
          --exclude dynamic-config-python
          --exclude dynamic-config-etcd
          --exclude dynamic-config-consul
          --exclude dynamic-config-nats
          --exclude dynamic-config-vault
          --exclude dynamic-config-redis
          --exclude dynamic-config-s3
          --exclude dynamic-config-firestore
          --exclude dynamic-config-embedded
      - run: cargo test -p dynamic-config-embedded --features std,async

      # The version bump keeps the semver promise it makes: compared against
      # the baseline already on crates.io. Pre-1.0, a breaking change needs
      # the minor bumped — this is the check that notices when it was not.
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-semver-checks
      # A crate that has never been released has no baseline to compare
      # against, and `cargo semver-checks` treats that as an error rather
      # than as nothing to do — so one unpublished member fails the whole
      # workspace run, which is exactly what happens on the release that
      # introduces a crate. 0.6 introduced three.
      #
      # The exclusions are *derived* rather than written down: a crate is
      # skipped only while crates.io has never heard of it, so the release
      # that first publishes it excludes it once and every release after
      # that checks it like any other. A list in this file would have to be
      # remembered, and would go stale silently — which is the failure mode
      # this whole job exists to prevent.
      #
      # `publish != []` drops the members that are `publish = false`; the
      # Python extension crates go to PyPI and have no crates.io name at
      # all. Anything but 200 or 404 fails the step: a rate limit or an
      # outage must not read as "unpublished, skip it".
      - name: the semver promise, against what is actually published
        run: |
          set -euo pipefail

          agent='dynamic-config release (github.com/ctolon/dynamic-config)'
          excludes=()

          for crate in $(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.publish != []) | .name'); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "User-Agent: ${agent}" \
              "https://crates.io/api/v1/crates/${crate}")

            case "${code}" in
              200) ;;
              404)
                echo "::notice::${crate} is not on crates.io yet — first release, so there is no baseline to compare against"
                excludes+=(--exclude "${crate}")
                ;;
              *)
                echo "::error::crates.io answered ${code} for ${crate}; refusing to guess whether it is published"
                exit 1
                ;;
            esac
          done

          cargo semver-checks --workspace ${excludes[@]+"${excludes[@]}"}

  publish:
    name: publish to crates.io
    needs: [decide, verify]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # `cargo publish` verifies each tarball by *building* it, and
      # etcd-client compiles its gRPC stubs at build time — the same protoc
      # the verify job needs, needed here too.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Three waves, in dependency order. Each crate pins the one below it
      # exactly, so a wave cannot succeed until the previous one is on the
      # registry — which is why this is a sequence rather than a matrix.
      #
      # `--no-verify` is deliberately *not* used: the verification build is the
      # last chance to catch a package that resolves locally through a path
      # dependency and nowhere else.
      #
      # Idempotent on purpose: a version already on the registry is *skipped*,
      # not died on. crates.io versions are permanent, so after a partial
      # failure — a rate limit, most likely — the only way forward is a rerun
      # that publishes the remainder.
      - name: publish, in dependency order
        run: |
          publish() {
            local out
            if out=$(cargo publish -p "$1" 2>&1); then
              echo "published $1"
            elif grep -qE "already (uploaded|exists)" <<<"$out"; then
              echo "$1 is already on the registry — skipped"
            else
              printf '%s\n' "$out"
              return 1
            fi
          }

          # The embedded crate depends on nothing in the workspace, so it
          # rides in the first wave alongside the macros.
          publish dynamic-config-macros
          publish dynamic-config-embedded

          sleep 45   # the index needs a moment before dependents resolve

          publish dynamic-config

          sleep 45

          # Every store crate depends on this one, so it is a wave of its
          # own between the engine and them. It is published rather than
          # `publish = false` because cargo refuses to package a published
          # crate against a path dependency that is not on the registry.
          publish dynamic-config-store-core

          sleep 45

          for crate in dynamic-config-etcd dynamic-config-consul \
                       dynamic-config-nats dynamic-config-vault \
                       dynamic-config-redis dynamic-config-s3 \
                       dynamic-config-firestore dynamic-config-git \
                       dynamic-config-server dynamic-config-cli; do
            publish "$crate"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  wheels:
    name: wheels to PyPI
    needs: [decide, publish]
    # Rides a workspace release, but publishes on its *own* version: the
    # Python package moves when the Python package changes, and
    # `maturin upload --skip-existing` makes a run that changed nothing
    # here a no-op. A Python-only release is a manual dispatch of this
    # workflow after its version moves.
    # `always()` rather than the bare condition: a job with `needs` carries
    # an implicit `success()`, and an `if` only replaces it when it names a
    # status function. On a Python-only dispatch the workspace version has
    # not moved, so `publish` is *skipped* — and a skipped dependency
    # skipped this job too, which meant the manual wheel wave RELEASING.md
    # documents could never actually run. `publish` is still required not
    # to have *failed*.
    if: >-
      always()
      && needs.decide.result == 'success'
      && needs.publish.result != 'failure'
      && needs.publish.result != 'cancelled'
      && (needs.decide.outputs.release == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # One protoc for every wheel this job builds — the container's, the
      # macOS runner's and the Windows runner's. Pinned rather than
      # "whatever the index has today": see the installs below.
      PROTOC_VERSION: "29.3"
    strategy:
      # One platform failing must not strand the others: PyPI takes wheels
      # as they arrive, and a rerun uploads only what is missing.
      fail-fast: false
      matrix:
        include:
          # `manylinux` is the base wheel's image; `manylinux_remote` is the
          # remote one's, and they differ for a measured reason. The base
          # wheel compiles no C at all, so the default image is fine
          # anywhere. The remote wheel carries an AWS SDK and therefore
          # `aws-lc-sys`, which builds AWS-LC from source — and on the
          # aarch64 row `manylinux: auto` selects the *manylinux2014* cross
          # image, whose toolchain is too old to compile it: the 0.6
          # release's first attempt failed there and nowhere else, with the
          # x86_64 row (which `auto` resolves to a 2_28 image) building the
          # same code cleanly. So the remote wheel asks for 2_28 on both
          # Linux rows, which is glibc 2.28 — RHEL 8, Ubuntu 18.10, Debian
          # 10 — a floor a wheel with an AWS SDK in it can carry.
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
            manylinux_remote: "2_28"
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
            manylinux_remote: "2_28"
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      # abi3 means one wheel per platform covers every supported
      # interpreter, which is the whole reason the remote stores stay out
      # of this crate: their clients would multiply this matrix by their
      # own build requirements.
      # A target directory each, for both wheel builds below, and it is not
      # a nicety: both extension modules are `[lib] name = "_core"`, so they
      # write the same `lib_core.so`. Two builds sharing one target
      # directory make the second a cache hit on the first's artefact, and
      # the published wheel then carries the *other* package's extension —
      # a release that installs and then fails on a missing attribute.
      - uses: PyO3/maturin-action@e10f6c464b90acceb5f640d31beda6d586ba7b4a # v1
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/python
        with:
          command: build
          args: --release --out dist --manifest-path dynamic-config-python/Cargo.toml
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
      # The opt-in remote wheel, into the same `dist`: a separate
      # distribution (`dynamic-config-py[remote]` resolves to it) built from
      # the same matrix, because it is abi3 too. It is uploaded *after* the
      # base wheel — `maturin upload dist/*` walks the directory in name
      # order, and `dynamic_config_py-` sorts before `dynamic_config_py_remote`
      # — so the extra never resolves to something whose requirement is not
      # on PyPI yet.
      #
      # It carries `dynamic-config-etcd`, whose gRPC client compiles its
      # stubs at build time and needs `protoc` — which no runner image has.
      # Every other job in this repository installs it with `apt-get`; that
      # would not work here, because the Linux rows of this matrix build
      # *inside* the manylinux container and a package installed on the
      # runner is not in it. So it is installed twice, in two places:
      # `before-script-linux` runs in the container, and the two steps below
      # run on the runner itself.
      #
      # **From the project's own release, pinned, rather than from a package
      # manager.** The 0.6 release found out why: `choco install protoc`
      # answered "the package was not found with the source(s) listed" and
      # took the Windows wheel down with it, and the feed was returning 504
      # for that name an hour later. A wheel wave is not the place to
      # discover that somebody else's index is having an afternoon — and a
      # pinned binary also means every platform's wheels are built by the
      # *same* compiler, which is a property worth having for its own sake.
      - if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-osx-universal_binary.zip"
          sudo unzip -o "${RUNNER_TEMP}/protoc.zip" 'bin/protoc' 'include/*' -d /usr/local
          protoc --version
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:PROTOC_VERSION
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'protoc'

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          # `GITHUB_PATH` rather than `$env:PATH`: each step is its own
          # shell, and the build below is the step that needs it.
          Join-Path $dir 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $dir 'bin\protoc.exe') --version
      - uses: PyO3/maturin-action@e10f6c464b90acceb5f640d31beda6d586ba7b4a # v1
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/python-remote
        with:
          command: build
          args: --release --out dist --manifest-path dynamic-config-python-remote/Cargo.toml
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux_remote }}
          # The container is whichever manylinux image maturin selects, and
          # they are not one distribution: the x86_64 image is RPM-based and
          # the cross image for aarch64 is Debian-based. Asking the package
          # manager that is present is shorter than pinning the image.
          #
          # A packaged `protoc` is not enough on its own — the older images
          # carry a protobuf 2 compiler, which cannot read the proto3 files
          # `etcd-client` builds from — so the version is checked and the
          # official release is fetched when it is too old. `uname -m` is
          # the *host* architecture even for the aarch64 row, which
          # cross-compiles, and that is the binary that has to run.
          before-script-linux: |
            set -eux
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y protobuf-compiler unzip || true
            elif command -v yum >/dev/null 2>&1; then
              yum install -y protobuf-compiler unzip || true
            else
              apt-get update && apt-get install -y protobuf-compiler unzip
            fi
            if ! protoc --version 2>/dev/null | grep -qE 'libprotoc (3|[1-9][0-9])'; then
              version=${{ env.PROTOC_VERSION }}
              case "$(uname -m)" in
                aarch64|arm64) arch=aarch_64 ;;
                *) arch=x86_64 ;;
              esac
              curl -fsSL -o /tmp/protoc.zip \
                "https://github.com/protocolbuffers/protobuf/releases/download/v${version}/protoc-${version}-linux-${arch}.zip"
              unzip -o /tmp/protoc.zip -d /usr/local
            fi
            protoc --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  free-threaded-wheels:
    name: free-threaded wheels to PyPI
    needs: [decide, publish]
    # The same condition as `wheels`, and for the same reasons.
    if: >-
      always()
      && needs.decide.result == 'success'
      && needs.publish.result != 'failure'
      && needs.publish.result != 'cancelled'
      && (needs.decide.outputs.release == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux only, and deliberately. The manylinux images carry a
          # `python3.14t` that maturin-action can be pointed at, which is the
          # documented and exercised path; the macOS and Windows runners were
          # not verified for a free-threaded interpreter when this landed, and
          # a release job that fails on an unverified guess is worse than one
          # platform's users building from source. Widening this is a matter
          # of somebody running it once — the tag assertion below is what
          # would catch a wrong guess.
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A separate job rather than a row in the matrix above, because it is a
      # different *kind* of wheel: `Py_GIL_DISABLED` has no stable ABI, so this
      # one is version-specific and tagged `cp314-cp314t`, where the base wheel
      # covers 3.9 upwards on one file per platform.
      #
      # `-i python3.14t` is the part that does the work. Without it maturin
      # builds abi3 against no interpreter in particular; pointed at a
      # free-threaded one it emits the version-specific wheel.
      # `--no-default-features` switches off the `abi3` Cargo feature as well,
      # which does not change the tag but means pyo3 is never asked for abi3
      # and the build does not lean on its compatibility fallback.
      #
      # One interpreter row, not two: PyO3 0.29 dropped 3.13t when CPython
      # promoted free-threading from experimental to supported in 3.14, so a
      # `cp313t` wheel is not buildable from this source at all.
      #
      # The remote wheel is deliberately not built here: it stays abi3-only
      # until somebody asks for it without a GIL.
      - uses: PyO3/maturin-action@e10f6c464b90acceb5f640d31beda6d586ba7b4a # v1
        with:
          command: build
          args: >-
            --release --out dist --no-default-features -i python3.14t
            --manifest-path dynamic-config-python/Cargo.toml
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
      # maturin picks the tag from the interpreter it was pointed at, and a
      # misconfiguration here is silent: an abi3 wheel with a `t` in its name
      # would install and then crash. Assert the tag rather than trust it.
      - name: the wheels are free-threaded and not abi3
        run: |
          ls dist
          if ls dist/*abi3*.whl >/dev/null 2>&1; then
            echo "::error::a free-threaded build produced an abi3 wheel"
            exit 1
          fi
          ls dist/*cp314-cp314t*.whl >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-freethreaded-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  publish-wheels:
    name: publish the wheels
    needs: [decide, wheels, free-threaded-wheels]
    # The same shape as `wheels`, and for the same reason. Both wheel waves
    # must have succeeded: publishing the abi3 wheels while the free-threaded
    # ones failed would leave `pip install` on 3.14t building from source,
    # which is the outcome the free-threading page calls worse than saying
    # nothing.
    if: >-
      always()
      && needs.wheels.result == 'success'
      && needs.free-threaded-wheels.result == 'success'
      && (needs.decide.outputs.release == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      # `--skip-existing`, for the same reason the crates.io wave skips
      # what is already uploaded: a version on PyPI is permanent, so the
      # only way forward after a partial failure is a rerun that publishes
      # the remainder.
      - run: pip install maturin
      - run: maturin upload --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  tag-and-release:
    name: tag and GitHub release
    needs: [decide, publish, publish-wheels]
    # The tag marks the crates.io release, so it waits for the wheels but
    # is not held hostage by a wheel wave that was skipped or failed on a
    # platform runner — the Rust release is complete either way.
    if: needs.decide.outputs.release == 'true' && !cancelled() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The tag marks what was actually published: it is minted only after
      # every crate is on the registry, at the merge commit that did it.
      - name: tag the release
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "dynamic-config $VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      - name: notes from the changelog
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          # The section for this version, up to the next one.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md > release-notes.md

          echo "--- notes ---"
          cat release-notes.md

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ needs.decide.outputs.version }}
          name: v${{ needs.decide.outputs.version }}
          body_path: release-notes.md
