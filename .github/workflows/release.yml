name: Release

# Publishing is triggered by a tag, and the tag is the only thing that decides
# what gets published. Anything else — a branch, a manual click with a version
# box — makes "what is on crates.io" a question rather than a fact.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The tag and the manifest have to agree. They diverge exactly once, on
      # the release where somebody forgot, and then the registry has a version
      # nothing in the repository names.
      - name: the tag matches the workspace version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)

          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $declared"
            exit 1
          fi

      - name: the changelog names this version
        run: |
          version="${GITHUB_REF_NAME#v}"

          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no section for $version"
            exit 1
          fi

      - run: cargo fmt --all -- --check
      # `etcd-client` compiles its gRPC stubs at build time and needs `protoc`.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --workspace --all-targets --all-features
      # The same excludes as ci.yml's test job: the container suites need
      # Docker images pulled and a long leash, and they gate merges to main —
      # a tag build re-proving them adds an hour, not confidence. The embedded
      # crate has its own features and no `full`.
      - run: >
          cargo test --workspace --features full
          --exclude dynamic-config-etcd
          --exclude dynamic-config-consul
          --exclude dynamic-config-nats
          --exclude dynamic-config-vault
          --exclude dynamic-config-redis
          --exclude dynamic-config-s3
          --exclude dynamic-config-firestore
          --exclude dynamic-config-embedded
      - run: cargo test -p dynamic-config-embedded --features std,async

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `cargo publish` verifies each tarball by *building* it, and
      # etcd-client compiles its gRPC stubs at build time — the same protoc
      # the verify job needs, needed here too.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Three waves, in dependency order. Each crate pins the one below it
      # exactly, so a wave cannot succeed until the previous one is on the
      # registry — which is why this is a sequence rather than a matrix.
      #
      # `--no-verify` is deliberately *not* used: the verification build is the
      # last chance to catch a package that resolves locally through a path
      # dependency and nowhere else.
      #
      # Idempotent on purpose: a version already on the registry is *skipped*,
      # not died on. crates.io versions are permanent, so after a partial
      # failure the only way forward is a rerun that publishes the remainder —
      # a pipeline that trips over its own earlier success cannot recover.
      - name: publish, in dependency order
        run: |
          publish() {
            local out
            if out=$(cargo publish -p "$1" 2>&1); then
              echo "published $1"
            elif grep -q "already uploaded" <<<"$out"; then
              echo "$1 v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2) is already on the registry — skipped"
            else
              printf '%s\n' "$out"
              return 1
            fi
          }

          # The embedded crate depends on nothing in the workspace, so it
          # rides in the first wave alongside the macros.
          publish dynamic-config-macros
          publish dynamic-config-embedded

          sleep 45   # the index needs a moment before dependents resolve

          publish dynamic-config

          sleep 45

          for crate in dynamic-config-etcd dynamic-config-consul \
                       dynamic-config-nats dynamic-config-vault \
                       dynamic-config-redis dynamic-config-s3 \
                       dynamic-config-firestore; do
            publish "$crate"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"

          # The section for this version, up to the next one.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md > release-notes.md

          echo "--- notes ---"
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
