name: Book

# Builds the mdBook under `book/` and publishes it to GitHub Pages. Runs on
# `main` so the published site documents what is *released*, not what is in
# flight on `dev` — `main` only advances through gated pull requests, and a
# release is itself a merge to `main`. Not tag-triggered on purpose: the
# release tag is minted by release.yml with the default `GITHUB_TOKEN`, and
# events created with that token never start other workflows, so a
# tag-triggered deploy would simply never fire. The published site is
# versionless prose, not API reference — docs.rs remains the API's home.
on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "book-python/**"
      - "book-node/**"
      - ".github/workflows/book.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install mdbook
        # Digest-verified before anything is extracted: the rest of this
        # repository pins its actions by SHA, and a binary whose output is
        # published to Pages deserves the same suspicion.
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o mdbook.tar.gz \
            https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz
          echo "c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768  mdbook.tar.gz" | sha256sum -c -
          tar -xzf mdbook.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: mdbook build book
      # The Python binding's book, published *inside* the first one's output
      # rather than beside it: one Pages deployment, two directories —
      # `/dynamic-config/` and `/dynamic-config/python/`. A reader who does
      # need to cross over is one link away and no DNS is involved.
      #
      # Built second on purpose: `mdbook build book` empties `book/book`
      # first, so the other order would publish an empty `python/`.
      - run: mdbook build book-python --dest-dir book/book/python
      - run: mdbook build book-node --dest-dir book/book/node

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
