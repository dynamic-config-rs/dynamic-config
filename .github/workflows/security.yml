name: Security

# Advisories are published on someone else's schedule, so this runs on one of
# its own as well as on every change. A dependency that was clean on Monday is
# not necessarily clean on Friday, and nothing about this repository has to
# change for that to happen.
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Keyed on the commit, like ci.yml: a dev push and its pull request must
# not run the same checks twice for the same SHA.
concurrency:
  group: security-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    name: advisories, licences, sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          # The full `check` — advisories, licences, sources *and* bans — so a
          # duplicate-dependency policy in deny.toml is enforced somewhere
          # rather than assumed to be enforced somewhere else.
          command: check

  unsafe:
    name: no unsafe code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Every crate here declares `#![forbid(unsafe_code)]`, which the compiler
      # enforces. This proves the declaration is still there rather than
      # trusting that nobody removed it in a hurry.
      - run: |
          for crate in dynamic-config dynamic-config-macros \
                       dynamic-config-etcd dynamic-config-consul \
                       dynamic-config-nats dynamic-config-vault \
                       dynamic-config-redis dynamic-config-s3 \
                       dynamic-config-firestore dynamic-config-embedded; do
            if ! grep -q '#!\[forbid(unsafe_code)\]' "$crate/src/lib.rs"; then
              echo "::error file=$crate/src/lib.rs::missing #![forbid(unsafe_code)]"
              exit 1
            fi
          done

  secrets-in-diagnostics:
    name: secrets stay out of diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The property is enforced by tests rather than by review, so this job
      # exists to make sure those tests are the ones that ran. Named
      # deliberately: a green tick against this line is the claim being made.
      - run: cargo test -p dynamic-config --features full --test security
      - run: cargo test -p dynamic-config --features full --test safety
      - run: cargo test -p dynamic-config --features full --test observability
      # The write path: created `0600`, and a planted symlink refused.
      - run: cargo test -p dynamic-config --features json --lib write::permissions

  supply-chain:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Flags a pull request that adds a dependency with a known advisory or a
      # licence outside the allow-list, at the point where changing course is
      # still cheap.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure

  # The one status branch protection requires from this workflow — same
  # reasoning as CI's gate. `supply-chain` is deliberately absent from the
  # needs: it only exists on pull requests, and a gate that needs a job that
  # never ran would hang a plain push forever.
  security-ok:
    name: Security is green
    needs: [deny, unsafe, secrets-in-diagnostics]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job this gate needs has succeeded
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
