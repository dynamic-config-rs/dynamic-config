name: Security

# Advisories are published on someone else's schedule, so this runs on one of
# its own as well as on every change. A dependency that was clean on Monday is
# not necessarily clean on Friday, and nothing about this repository has to
# change for that to happen.
# No push trigger for `dev` — same reasoning as ci.yml: dev travels through
# pull requests, and a push twin under required checks poisons the gate.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# A push during a run makes the older run's answer obsolete.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    name: advisories, licences, sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          # The full `check` — advisories, licences, sources *and* bans — so a
          # duplicate-dependency policy in deny.toml is enforced somewhere
          # rather than assumed to be enforced somewhere else.
          command: check

  unsafe:
    name: no unsafe code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Every crate here declares `#![forbid(unsafe_code)]`, which the compiler
      # enforces. This proves the declaration is still there rather than
      # trusting that nobody removed it in a hurry.
      - run: |
          for crate in dynamic-config dynamic-config-macros \
                       dynamic-config-etcd dynamic-config-consul \
                       dynamic-config-nats dynamic-config-vault \
                       dynamic-config-redis dynamic-config-s3 \
                       dynamic-config-firestore dynamic-config-embedded \
                       dynamic-config-store-core dynamic-config-git \
                       dynamic-config-server; do
            if ! grep -q '#!\[forbid(unsafe_code)\]' "$crate/src/lib.rs"; then
              echo "::error file=$crate/src/lib.rs::missing #![forbid(unsafe_code)]"
              exit 1
            fi
          done
          # The CLI and the server are binaries too: their roots are main.rs,
          # so they get their own lines rather than a silent exemption from
          # the loop above.
          for root in dynamic-config-cli/src/main.rs \
                      dynamic-config-server/src/main.rs; do
            if ! grep -q '#!\[forbid(unsafe_code)\]' "$root"; then
              echo "::error file=$root::missing #![forbid(unsafe_code)]"
              exit 1
            fi
          done
          # The Python extension cannot say `#![forbid(unsafe_code)]`: PyO3's
          # `#[pyclass]` and `#[pymethods]` expand to `unsafe impl`, which is
          # the binding machinery rather than this repository's code. What
          # *is* checkable is that the hand-written half has none, and that
          # is what this looks at.
          if grep -rn 'unsafe' dynamic-config-python/src/; then
            echo "::error::hand-written unsafe in the Python extension"
            exit 1
          fi
          # The Node addon, for the same reason: `#[napi]` expands to
          # `unsafe impl` and `unsafe fn` for the Node-API conversions. One
          # hand-written exception is audited in place — the `ToNapiValue`
          # that hands a JSON document to an async task's promise — and it
          # delegates to the conversion `serde_json` already has.
          # Comment lines are the two that *explain* the exemption; what
          # is being looked for is code.
          # Both addons: the stores one has its own hand-written
          # `ToNapiValue`, and a gate that scanned only the first would
          # have let anything into the second.
          stray_node=$(grep -rn 'unsafe' \
              dynamic-config-node/src/ dynamic-config-node-remote/src/ \
            | grep -v 'outcome.rs' \
            | grep -v 'node-remote/src/lib.rs:[0-9]*: *unsafe fn to_napi_value' \
            | grep -v 'node-remote/src/lib.rs:[0-9]*: *unsafe { Value::to_napi_value' \
            | grep -v ':[0-9]*://' \
            | grep -v 'unsafe_op_in_unsafe_fn' || true)
          if [ -n "$stray_node" ]; then
            echo "::error::hand-written unsafe in the Node addon: $stray_node"
            exit 1
          fi
          # Tests, examples and benches are separate crates, so the lib's
          # `forbid` does not reach them — the whole no-unsafe claim would
          # be one bench file away from fiction if nothing looked. Exactly
          # one exemption exists: the allocation profile's counting
          # allocator, because `GlobalAlloc` is an unsafe trait and there
          # is no safe way to hook the allocator. It never ships, and its
          # unsafe is two delegating lines audited in place.
          stray=$(grep -rln 'unsafe' \
              dynamic-config/tests dynamic-config/benches dynamic-config/examples \
              dynamic-config-*/tests dynamic-config-*/examples 2>/dev/null \
            | grep -v 'benches/alloc_profile.rs' || true)
          if [ -n "$stray" ]; then
            echo "::error::unsafe outside the audited exemption: $stray"
            exit 1
          fi

  osv:
    name: advisories, every ecosystem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      # One scanner over every ecosystem rather than one per ecosystem, and
      # deliberately *not* a second copy of cargo-deny: OSV aggregates RustSec,
      # PyPA and GitHub advisories, so it carries entries RustSec does not and
      # the two disagreeing is information rather than noise.
      #
      # What it closes is a real gap: the wheels ship Pydantic,
      # pydantic-settings and msgspec as runtime dependencies of a published
      # artefact, and cargo-deny has never heard of any of them.
      #
      # The binary, pinned and checksummed like every other download here.
      # An action would be one more third party in a job about third parties.
      - name: install osv-scanner
        run: |
          curl -sSL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          echo "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c  osv-scanner" \
            | sha256sum -c -
          chmod +x osv-scanner
      # Neither wheel commits a lockfile, and neither should — a library that
      # pinned its dependencies would pin its users'. What is auditable is
      # what somebody installing today actually resolves, so it is resolved
      # here and the frozen result is what gets scanned.
      - name: resolve what the wheels install
        run: python scripts/resolve-python-audit.py /tmp/audit-venv /tmp/python-requirements.txt
      # `osv-scanner.toml` at the root carries the exemptions, each with the
      # reason and what would expire it. It is a second list beside
      # deny.toml's on purpose: cargo-deny refuses an ignore that matches
      # nothing it raises, so an advisory only OSV reports cannot be answered
      # there.
      # `|| true`, and the classification is the next step's: the scanner
      # exits non-zero for *any* finding, and an unmaintained crate with no
      # published fix is not something a pull request here can answer.
      # Failing on those is how a gate becomes one people learn to ignore.
      - name: scan
        run: |
          ./osv-scanner scan source \
            --lockfile Cargo.lock \
            --lockfile "requirements.txt:/tmp/python-requirements.txt" \
            --format json --output osv.json || true
      # Fails on anything with a fix available, warns on anything without
      # one, and writes both halves into the job summary either way.
      - name: report
        run: python scripts/audit-report.py osv.json "$GITHUB_STEP_SUMMARY"

  secrets-in-diagnostics:
    name: secrets stay out of diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The property is enforced by tests rather than by review, so this job
      # exists to make sure those tests are the ones that ran. Named
      # deliberately: a green tick against this line is the claim being made.
      - run: cargo test -p dynamic-config --features full --test security
      - run: cargo test -p dynamic-config --features full --test safety
      - run: cargo test -p dynamic-config --features full --test observability
      # The write path: created `0600`, and a planted symlink refused.
      - run: cargo test -p dynamic-config --features json --lib write::permissions

  supply-chain:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Flags a pull request that adds a dependency with a known advisory or a
      # licence outside the allow-list, at the point where changing course is
      # still cheap.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure

  # The one status branch protection requires from this workflow — same
  # reasoning as CI's gate. `supply-chain` IS in the needs even though it only
  # exists on pull requests: the gate's own check tolerates `skipped`, so a
  # plain push passes, while a PR with a failing dependency review is blocked
  # — which is the whole point of running it.
  security-ok:
    name: Security is green
    needs: [deny, osv, unsafe, secrets-in-diagnostics, supply-chain]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job this gate needs has succeeded
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
