[package]
name = "dynamic-config-cli"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Command-line diagnostics for dynamic-config: explain a value, diff two documents"
repository = "https://github.com/ctolon/dynamic-config"
# Not on crates.io yet: Experimental, shipped in-repo. The release pipeline's
# publish waves do not know it, and `cargo package --workspace` skips it.
publish = false

[[bin]]
name = "dynamic-config"
path = "src/main.rs"

[dependencies]
dynamic-config = { version = "=0.2.0", path = "../dynamic-config", features = [
    "json",
    "toml",
    "yaml",
    "dotenv",
] }
# The same floor the core declares: a higher requirement here would drag
# the whole workspace's clap past the core's 1.71 MSRV row.
clap = { version = "4.4", features = ["derive"] }
